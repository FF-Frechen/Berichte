version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feuerwehr-backend
    restart: unless-stopped
    user: "0:0"
    environment:
      - DB_PATH=/app/data/feuerwehr.db
      - PDF_PATH=/config/pdfs
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - DELETE_PASSWORD=${DELETE_PASSWORD}
      - EMAIL_RECIPIENTS=${EMAIL_RECIPIENTS}
      - EMAIL_RECIPIENTS_ANWESENHEIT=${EMAIL_RECIPIENTS_ANWESENHEIT}
      - NAMEN=${NAMEN}
      - VEHICLE_1_ID=${VEHICLE_1_ID:-}
      - VEHICLE_1_NAME=${VEHICLE_1_NAME:-}
      - VEHICLE_1_DISPLAY_NAME=${VEHICLE_1_DISPLAY_NAME:-}
      - VEHICLE_1_FUNCTIONS=${VEHICLE_1_FUNCTIONS:-}
      # ... alle anderen VEHICLE Variablen ...
    volumes:
      - feuerwehr-data:/app/data
      - ${CONFIG_PATH:-feuerwehr-config}:/config
    networks:
      - feuerwehr-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feuerwehr-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - feuerwehr-network

networks:
  feuerwehr-network:
    driver: bridge

volumes:
  feuerwehr-data:
    driver: local
  feuerwehr-config:
    driver: local
