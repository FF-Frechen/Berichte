version: '3.8'

# Portainer Stack Configuration mit automatischem Build aus Git Repository
# =========================================================================
# Diese Konfiguration wird von Portainer direkt aus GitHub gepullt.
# Portainer baut die Images automatisch beim Deployment.
#
# Deployment in Portainer:
# 1. Stacks → Add stack → Repository
# 2. Repository URL: https://github.com/FF-Frechen/Berichte
# 3. Branch: main
# 4. Compose path: portainer-stack.yml
# 5. Authentication: GitHub Token (siehe GITHUB-TOKEN-GUIDE.md)
# 6. Environment Variables setzen (siehe .env.portainer.example)
# 7. Deploy the stack
#
# Beim ersten Deployment baut Portainer die Images (ca. 5-10 Minuten).
# Updates: "Pull and redeploy" klicken - Portainer pullt und baut neu.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: feuerwehr-backend:latest
    container_name: feuerwehr-backend
    restart: unless-stopped
    user: "0:0"
    environment:
      - DB_PATH=/app/data/feuerwehr.db
      - PDF_PATH=/config/pdfs
      - NODE_ENV=production
      # SMTP-Konfiguration (in Portainer als Stack-Variablen setzen!)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - DELETE_PASSWORD=${DELETE_PASSWORD}
      - EMAIL_RECIPIENTS=${EMAIL_RECIPIENTS}
      - EMAIL_RECIPIENTS_ANWESENHEIT=${EMAIL_RECIPIENTS_ANWESENHEIT}
      # Namensliste (in Portainer als Stack-Variable setzen!)
      - NAMEN=${NAMEN}
    volumes:
      # Datenbank
      - feuerwehr-data:/app/data
      # PDFs (verwendbar mit Named Volume oder Host-Pfad)
      - ${CONFIG_PATH:-feuerwehr-config}:/config
    networks:
      - feuerwehr-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: feuerwehr-frontend:latest
    container_name: feuerwehr-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - feuerwehr-network

networks:
  feuerwehr-network:
    driver: bridge

volumes:
  feuerwehr-data:
    driver: local
  feuerwehr-config:
    driver: local
