      # Datenbank
      - feuerwehr-data:/app/data
      # PDFs (verwendbar mit Named Volume oder Host-Pfad)
      - ${CONFIG_PATH:-feuerwehr-config}:/config
    networks:
      - feuerwehr-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feuerwehr-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - feuerwehr-network

networks:
  feuerwehr-network:
    driver: bridge

volumes:
  feuerwehr-data:
    driver: local
  feuerwehr-config:
    driver: local
