version: '3.8'

services:
  backend:
    build: ./backend
    container_name: feuerwehr-backend
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/feuerwehr.db
      - PDF_PATH=/config/pdfs
      # SMTP-Konfiguration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      # Sicherheit
      - DELETE_PASSWORD=${DELETE_PASSWORD}
      # E-Mail-Empfänger
      - EMAIL_RECIPIENTS_BERICHT=${EMAIL_RECIPIENTS_BERICHT}
      - EMAIL_RECIPIENTS_ANWESENHEIT=${EMAIL_RECIPIENTS_ANWESENHEIT}
      - EMAIL_RECIPIENTS_SONDER=${EMAIL_RECIPIENTS_SONDER}
      # Namensliste
      - NAMEN=${NAMEN}
      # Fahrzeugkonfiguration
      - VEHICLE_1_ID=${VEHICLE_1_ID}
      - VEHICLE_1_NAME=${VEHICLE_1_NAME}
      - VEHICLE_1_DISPLAY_NAME=${VEHICLE_1_DISPLAY_NAME}
      - VEHICLE_1_FUNCTIONS=${VEHICLE_1_FUNCTIONS}
      - VEHICLE_2_ID=${VEHICLE_2_ID}
      - VEHICLE_2_NAME=${VEHICLE_2_NAME}
      - VEHICLE_2_DISPLAY_NAME=${VEHICLE_2_DISPLAY_NAME}
      - VEHICLE_2_FUNCTIONS=${VEHICLE_2_FUNCTIONS}
      - VEHICLE_3_ID=${VEHICLE_3_ID}
      - VEHICLE_3_NAME=${VEHICLE_3_NAME}
      - VEHICLE_3_DISPLAY_NAME=${VEHICLE_3_DISPLAY_NAME}
      - VEHICLE_3_FUNCTIONS=${VEHICLE_3_FUNCTIONS}
      - VEHICLE_4_ID=${VEHICLE_4_ID}
      - VEHICLE_4_NAME=${VEHICLE_4_NAME}
      - VEHICLE_4_DISPLAY_NAME=${VEHICLE_4_DISPLAY_NAME}
      - VEHICLE_4_FUNCTIONS=${VEHICLE_4_FUNCTIONS}
      - VEHICLE_5_ID=${VEHICLE_5_ID}
      - VEHICLE_5_NAME=${VEHICLE_5_NAME}
      - VEHICLE_5_DISPLAY_NAME=${VEHICLE_5_DISPLAY_NAME}
      - VEHICLE_5_FUNCTIONS=${VEHICLE_5_FUNCTIONS}
      - VEHICLE_6_ID=${VEHICLE_6_ID}
      - VEHICLE_6_NAME=${VEHICLE_6_NAME}
      - VEHICLE_6_DISPLAY_NAME=${VEHICLE_6_DISPLAY_NAME}
      - VEHICLE_6_FUNCTIONS=${VEHICLE_6_FUNCTIONS}
      - VEHICLE_7_ID=${VEHICLE_7_ID}
      - VEHICLE_7_NAME=${VEHICLE_7_NAME}
      - VEHICLE_7_DISPLAY_NAME=${VEHICLE_7_DISPLAY_NAME}
      - VEHICLE_7_FUNCTIONS=${VEHICLE_7_FUNCTIONS}
      - VEHICLE_8_ID=${VEHICLE_8_ID}
      - VEHICLE_8_NAME=${VEHICLE_8_NAME}
      - VEHICLE_8_DISPLAY_NAME=${VEHICLE_8_DISPLAY_NAME}
      - VEHICLE_8_FUNCTIONS=${VEHICLE_8_FUNCTIONS}
      - VEHICLE_9_ID=${VEHICLE_9_ID}
      - VEHICLE_9_NAME=${VEHICLE_9_NAME}
      - VEHICLE_9_DISPLAY_NAME=${VEHICLE_9_DISPLAY_NAME}
      - VEHICLE_9_FUNCTIONS=${VEHICLE_9_FUNCTIONS}
      - VEHICLE_10_ID=${VEHICLE_10_ID}
      - VEHICLE_10_NAME=${VEHICLE_10_NAME}
      - VEHICLE_10_DISPLAY_NAME=${VEHICLE_10_DISPLAY_NAME}
      - VEHICLE_10_FUNCTIONS=${VEHICLE_10_FUNCTIONS}
      - VEHICLE_11_ID=${VEHICLE_11_ID}
      - VEHICLE_11_NAME=${VEHICLE_11_NAME}
      - VEHICLE_11_DISPLAY_NAME=${VEHICLE_11_DISPLAY_NAME}
      - VEHICLE_11_FUNCTIONS=${VEHICLE_11_FUNCTIONS}
      - VEHICLE_12_ID=${VEHICLE_12_ID}
      - VEHICLE_12_NAME=${VEHICLE_12_NAME}
      - VEHICLE_12_DISPLAY_NAME=${VEHICLE_12_DISPLAY_NAME}
      - VEHICLE_12_FUNCTIONS=${VEHICLE_12_FUNCTIONS}
      - VEHICLE_13_ID=${VEHICLE_13_ID}
      - VEHICLE_13_NAME=${VEHICLE_13_NAME}
      - VEHICLE_13_DISPLAY_NAME=${VEHICLE_13_DISPLAY_NAME}
      - VEHICLE_13_FUNCTIONS=${VEHICLE_13_FUNCTIONS}
    volumes:
      - ./data:/app/data
      - .:/config
    networks:
      - feuerwehr-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: feuerwehr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - feuerwehr-network

networks:
  feuerwehr-network:
    driver: bridge

volumes:
  data:
