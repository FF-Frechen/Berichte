version: '3.8'

services:
  backend:
    build: ./backend
    container_name: feuerwehr-backend
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/feuerwehr.db
      - PDF_PATH=/config/pdfs
      # SMTP-Konfiguration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      # Sicherheit
      - DELETE_PASSWORD=${DELETE_PASSWORD}
      # E-Mail-Empfänger
      - EMAIL_RECIPIENTS=${EMAIL_RECIPIENTS}
      - EMAIL_RECIPIENTS_ANWESENHEIT=${EMAIL_RECIPIENTS_ANWESENHEIT}
      # Namensliste
      - NAMEN=${NAMEN}
    volumes:
      - ./data:/app/data
      - .:/config
    networks:
      - feuerwehr-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: feuerwehr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - feuerwehr-network

networks:
  feuerwehr-network:
    driver: bridge

volumes:
  data:
